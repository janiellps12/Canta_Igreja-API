descricao: |
  Ao celebrarmos os 50 anos da Campanha da Fraternidade, a Conferência Nacional dos Bispos do Brasil, CNBB, tem a alegria de lançar a coletânea das partituras de todos os cantos que fizeram parte desta história.
  Esta edição tem o objetivo de valorizar e registrar a vasta produção de música sacra da Igreja no Brasil.
  Esta coletânea manterá viva a história da Campanha da Fraternidade e ajudará a cantar, hoje e sempre, as maravilhas do Deus da vida que caminha com seu povo!

  Este livro possui músicas das campanhas da fraternidade dos anos de 1970 a 2014. A versão impressa do livro contém, além da letra, a partitura das músicas.

  Adaptado do portal amazon.
