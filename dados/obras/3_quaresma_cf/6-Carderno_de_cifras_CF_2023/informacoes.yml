descricao: |
  Este Caderno de Partituras e Cifras "Quaresma e Iniciação à Vida Cristã", preparado e organizado pelo Setor de Música da Comissão Episcopal Pastoral para a Liturgia da CNBB, apresenta um rico repertório melódico para as partes fixas da Missa (Tempo da Quaresma); Salmos e cânticos apropriados para a catequese de Iniciação à Vida Cristã, conforme os ritos do RICA (Rito da Iniciação Cristã de Adultos); e sugestões adequadas de cantos quaresmais para o Ano Litúrgico "A". Esta edição contém cifra e partitura destacáveis para o hino oficial da Campanha da Fraternidade 2023.

  Adaptado do portal Edições CNBB.
