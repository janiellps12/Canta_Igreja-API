descricao: |
  A obra está dividida em cinco partes.
  A primeira contém os cantos de acordo com o Tempo Litúrgico (Advento, Natal, Quaresma, Páscoa...).
  Na segunda, estão as músicas do Ordinário da Missa (Saudação inicial, Ato penitencial, Glória...).
  A terceira parte traz os cantos para as Celebrações dos Sacramentos (Batismo, Primeira Eucaristia, Crisma...).
  Na quarta parte encontram-se músicas para celebrações com crianças, de acordo com o tempo litúrgico e os diversos momentos da celebração.
  Na quinta e última parte foram colocados cantos vocacionais, bíblicos, missionários, dentre outros.

  São mais de mil músicas para auxiliar o Povo de Deus a cantar a liturgia.
  Para glória e louvor de Deus!

  Dom Geraldo Majella Agnelo, Cardeal Arcebispo Emérito de Salvador

  Adaptado do portal PAULUS
