name: Record song addition dates
on:
  push:
    branches: [main]
    paths: ['dados/musicas/**', '.build/catalog_dates.py', '.github/workflows/catalog-dates.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-addition-dates
  cancel-in-progress: false
jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .build/catalog_dates.py
      - name: Save dates for the next API deployment
        run: |
          if ! git diff --quiet -- api/catalog_dates.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add api/catalog_dates.py
            git commit -m 'Record original addition dates for new songs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
